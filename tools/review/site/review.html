<style>
/* 版面：一欄的審查單，上面是摘要和篩選，下面一張一張問題卡；每張卡左邊的色條代表類型 */
:root{
  --bg:#eef2f1; --paper:#ffffff; --ink:#1d2a2b; --muted:#5d6e6f; --line:#d3dddc;
  --accent:#1f7a6d; --accent-soft:#d9efea;
  --k-trans:#2f6db5; --k-py:#b5652f; --k-vocab:#7a5ab5; --k-zh:#a83b4b;
  --yes:#1f7a6d; --no:#7b8788; --talk:#c08a1e;
  --f-zh:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141c1d; --paper:#1d2829; --ink:#e3ecea; --muted:#9db0ae; --line:#304143;
  --accent:#4fbfae; --accent-soft:#1d3a36; --k-trans:#6ea6ee; --k-py:#e39a62; --k-vocab:#b29aee; --k-zh:#e07a8a;
  --yes:#4fbfae; --no:#8c9a9b; --talk:#e2b04c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c1d; --paper:#1d2829; --ink:#e3ecea; --muted:#9db0ae; --line:#304143;
  --accent:#4fbfae; --accent-soft:#1d3a36; --k-trans:#6ea6ee; --k-py:#e39a62; --k-vocab:#b29aee; --k-zh:#e07a8a;
  --yes:#4fbfae; --no:#8c9a9b; --talk:#e2b04c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--f-zh);font-size:30px;margin:0;line-height:1.25;text-wrap:balance}
.lede{margin:4px 0 0;color:var(--muted);max-width:62ch}
.sum{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.sum b{font-size:22px;font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:13px}
.bar{flex:1 1 200px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.filters{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row>label{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:3.5em}
.chip{font:inherit;font-size:13px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.dec button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:8px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card[data-kind="翻譯"]{--k:var(--k-trans)} .card[data-kind="拼音"]{--k:var(--k-py)} .card[data-kind="單字表"]{--k:var(--k-vocab)} .card[data-kind="中文"]{--k:var(--k-zh)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.meta .kind{color:var(--k);font-weight:700;letter-spacing:.04em}
.meta .id{font-family:var(--f-mono)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.tag.es{border-color:var(--talk);color:var(--talk)}
.zh{font-family:var(--f-zh);font-size:19px;line-height:1.5;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:3.2em 1fr;gap:4px 10px;font-size:14px}
dt{color:var(--muted);font-size:12px;padding-top:2px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.sug{color:var(--accent);font-weight:500}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:10px}
.dec{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.dec button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.dec button+button{border-left:1px solid var(--line)}
.dec button[aria-pressed="true"][data-v="改"]{background:var(--yes);color:var(--paper)}
.dec button[aria-pressed="true"][data-v="不改"]{background:var(--no);color:var(--paper)}
.dec button[aria-pressed="true"][data-v="再討論"]{background:var(--talk);color:var(--paper)}
textarea{flex:1 1 220px;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;resize:vertical;min-height:32px}
.saved{font-size:12px;color:var(--muted);align-self:center}
.empty,.status{color:var(--muted);font-size:13px}
.status.err{color:var(--k-zh)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const ITEMS = JSON.parse(document.getElementById('items').textContent);
const GN = {drinks:'飲料店',reserva:'訂位',breakfast:'早餐店',parcel:'便利商店',nightmarket:'夜市',bakery:'麵包店',clinic:'診所',mrt:'捷運',street:'街頭',all:'多個遊戲'};
const KINDS = ['翻譯','拼音','單字表','中文'];
const F = { kind: '全部', game: '全部', state: '全部' };
const DEC = {};             // id → {choice, note}
let db = null;
const $ = s => document.querySelector(s);
const el = (t, a = {}, txt) => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };

function chips(box, key, opts) {
  opts.forEach(([v, label]) => {
    const b = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(F[key] === v) }, label);
    b.onclick = () => { F[key] = v; box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b))); render(); };
    box.appendChild(b);
  });
}
const cnt = (f) => ITEMS.filter(f).length;
chips($('#f-kind'), 'kind', [['全部', `全部 ${ITEMS.length}`], ...KINDS.map(k => [k, `${k} ${cnt(i => i.kind === k)}`]), ['西文', `西文相關 ${cnt(i => i.es)}`]]);
const games = [...new Set(ITEMS.map(i => i.game))];
chips($('#f-game'), 'game', [['全部', '全部'], ...games.map(g => [g, GN[g] || g])]);
chips($('#f-state'), 'state', [['全部', '全部'], ['未決定', '還沒決定'], ['改', '要改'], ['不改', '不改'], ['再討論', '再討論']]);

function summary() {
  const c = { 改: 0, 不改: 0, 再討論: 0 };
  ITEMS.forEach(i => { const d = DEC[i.id]; if (d && c[d.choice] != null) c[d.choice]++; });
  const done = c.改 + c.不改 + c.再討論, n = ITEMS.length;
  $('#n-all').textContent = n; $('#n-done').textContent = done;
  $('#n-yes').textContent = c.改; $('#n-no').textContent = c.不改; $('#n-talk').textContent = c.再討論;
  $('#b-yes').style.width = (c.改 / n * 100) + '%'; $('#b-no').style.width = (c.不改 / n * 100) + '%'; $('#b-talk').style.width = (c.再討論 / n * 100) + '%';
}

async function save(id, patch) {
  DEC[id] = { ...(DEC[id] || {}), ...patch };
  summary();
  if (!db) { setStatus('還沒連上，這個決定沒有存到。請重新整理頁面再試。', true); return false; }
  try {
    await db.collection('decisions').doc(id).set({ choice: DEC[id].choice || '', note: DEC[id].note || '', updatedAt: Date.now() });
    return true;
  } catch (e) {
    setStatus(e && e.code === 'not_granted' ? '你只有檢視權限，決定不會存。' : '存檔失敗，請稍後再試一次。', true);
    return false;
  }
}

function card(i) {
  const d = DEC[i.id] || {};
  const c = el('article', { class: 'card', 'data-kind': i.kind, id: 'c-' + i.id });
  const meta = el('div', { class: 'meta' });
  meta.append(el('span', { class: 'kind' }, i.kind), el('span', { class: 'tag' }, GN[i.game] || i.game), el('span', {}, i.sub));
  if (i.es) meta.append(el('span', { class: 'tag es' }, '西文'));
  meta.append(el('span', { class: 'id' }, i.id + (i.line ? ` · 第 ${i.line} 行` : '')));
  const dl = el('dl');
  [['現在', i.cur, ''], ['建議', i.sug, 'sug'], ['原因', i.why, '']].forEach(([k, v, cls]) => { if (v) { dl.append(el('dt', {}, k), el('dd', cls ? { class: cls } : {}, v)); } });
  const act = el('div', { class: 'act' });
  const dec = el('div', { class: 'dec', role: 'group', 'aria-label': '決定' });
  const saved = el('span', { class: 'saved' });
  ['改', '不改', '再討論'].forEach(v => {
    const b = el('button', { type: 'button', 'data-v': v, 'aria-pressed': String(d.choice === v) }, v === '改' ? '要改' : v);
    b.onclick = async () => {
      const choice = DEC[i.id]?.choice === v ? '' : v;
      dec.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === choice)));
      if (await save(i.id, { choice })) saved.textContent = '已存';
    };
    dec.append(b);
  });
  const ta = el('textarea', { id: 'note-' + i.id, rows: '1', placeholder: '備註（例如：改成……）', 'aria-label': '備註' });
  ta.value = d.note || '';
  ta.addEventListener('change', async () => { if (await save(i.id, { note: ta.value.trim() })) saved.textContent = '已存'; });
  act.append(dec, ta, saved);
  c.append(meta, el('div', { class: 'zh' }, i.zh), dl, act);
  return c;
}

function visible(i) {
  if (F.kind === '西文') { if (!i.es) return false; } else if (F.kind !== '全部' && i.kind !== F.kind) return false;
  if (F.game !== '全部' && i.game !== F.game) return false;
  const ch = DEC[i.id]?.choice || '';
  if (F.state === '未決定') return !ch;
  if (F.state !== '全部') return ch === F.state;
  return true;
}
function render() {
  const list = $('#list'); list.textContent = '';
  const vis = ITEMS.filter(visible);
  if (!vis.length) list.append(el('p', { class: 'empty' }, '這個篩選沒有項目。'));
  vis.forEach(i => list.append(card(i)));
  summary();
}
function setStatus(t, err) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!err); s.hidden = !t; }

render();
(async () => {
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) { setStatus('這個畫面沒辦法存檔（沒有登入或沒有權限），只能看。', true); return; }
  setStatus('');
  let first = true;
  db.collection('decisions').onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data() || {}; DEC[d.id] = { choice: v.choice || '', note: v.note || '' }; });
    // 第一次讀到、或別人改了：只更新沒在輸入的卡片
    const active = document.activeElement;
    if (first || !(active && active.tagName === 'TEXTAREA')) render(); else summary();
    first = false;
  }, () => setStatus('讀取決定時出錯，請重新整理頁面。', true));
})();
</script>
