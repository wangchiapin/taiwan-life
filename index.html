<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣生存日記 · Sobrevive en Taiwán</title>
<style>
  :root { --ink:#24202e; --bg:#2b3a2e; --card:#fffdf6; --line:#d9d2bd; --accent:#cf3a24; --muted:#6b6478; --gold:#f2b632; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans TC','Segoe UI',sans-serif; display: flex; flex-direction: column; align-items: center; overscroll-behavior: none; }
  button { font: inherit; cursor: pointer; }

  /* ── 名字畫面 ── */
  #intro { position: fixed; inset: 0; background: #e9f1e2; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; overflow: auto; }
  #intro .box { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); padding: 22px 22px 20px; max-width: 420px; width: 100%; text-align: center; }
  #intro h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  #intro .sub { margin: 4px 0 16px; color: var(--muted); }
  #intro label { display: block; text-align: left; font-weight: 700; margin-bottom: 4px; }
  #intro input { width: 100%; padding: 10px 12px; font-size: 18px; border: 2px solid var(--line); border-radius: 10px; }
  .seg-row { display: flex; gap: 10px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 14px; font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .go { width: 100%; background: var(--accent); color: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); }
  .err { color: var(--accent); min-height: 1.3em; font-size: 14px; text-align: left; }
  .note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  /* 玩家代碼 */
  .code-line { margin: 6px 0 0; font-size: 14px; text-align: left; }
  .code-line b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; letter-spacing: 1px; background: #fff3c9; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
  .have-code { text-align: left; margin: 10px 0 0; font-size: 14px; }
  .have-code summary { cursor: pointer; color: var(--muted); }
  .code-row { display: flex; gap: 8px; margin-top: 6px; }
  .code-row input { flex: 1; min-width: 0; text-transform: uppercase; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .code-row button { border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 0 12px; white-space: nowrap; }

  /* ── 地圖畫面 ── */
  #hud { width: 100%; max-width: 960px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; flex-wrap: wrap; color: #fff; }
  #hud .title { font-weight: 700; font-size: 17px; margin-right: auto; }
  #hud .chip { background: rgba(255,255,255,.15); border-radius: 999px; padding: 3px 12px; font-size: 14px; white-space: nowrap; }
  #hud button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 3px 12px; font-size: 14px; }
  #stage { width: 100%; max-width: 960px; padding: 0 6px; position: relative; }
  /* 星星進度條 */
  #week { width: 100%; max-width: 960px; display: flex; align-items: center; gap: 10px; padding: 0 12px 4px; color: #fff; font-size: 14px; }
  #week .bar { flex: 1; height: 14px; background: rgba(255,255,255,.15); border: 2px solid #1b1a22; border-radius: 999px; overflow: hidden; }
  #week .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f2b632, #ffd66b); transition: width .6s; }
  #week b { white-space: nowrap; }
  /* 對話泡泡 */
  #bubble { position: absolute; z-index: 4; max-width: 240px; background: #fffdf6; color: #1b1a22; border: 2px solid #1b1a22; border-radius: 12px; padding: 5px 10px 6px; font-size: 16px; line-height: 1.35; text-align: left; box-shadow: 2px 2px 0 #1b1a22; cursor: pointer; font-family: inherit; }
  #bubble small { display: block; font-size: 11px; color: #6b6478; font-weight: 700; }
  #bubble i { font-style: normal; font-size: 11px; margin-left: 6px; opacity: .7; }
  #bubble::after { content: ''; position: absolute; left: calc(var(--tail, 50%) - 6px); bottom: -8px; border: 6px solid transparent; border-top-color: #1b1a22; border-bottom: 0; }
  /* 拼音翻譯小卡 */
  #card { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); background: #fffdf6; border: 3px solid #1b1a22; border-radius: 16px; box-shadow: 4px 4px 0 #1b1a22; padding: 14px 16px; z-index: 15; }
  #card .c-who { font-size: 13px; color: #6b6478; font-weight: 700; }
  #card .c-zh { font-size: 24px; font-weight: 700; margin: 4px 0 2px; }
  #set-open { padding: 8px 18px; border-radius: 999px; border: 1.5px solid #2B2620; background: #fff; color: #2B2620; font: inherit; font-size: 15px; cursor: pointer; }
  #set-ov { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(46,36,28,.55); overflow-y: auto; }
  #set-ov.show { display: flex; }
  .set-card { width: 100%; max-width: 380px; margin: auto; background: #fff; color: #2B2620; border: 2px solid #2B2620; border-radius: 18px; padding: 18px 16px; text-align: center; }
  .set-card h2 { margin: 0 0 10px; font-size: 20px; }
  .set-group { margin: 12px 0; text-align: left; }
  .set-group h3 { font-size: 13px; margin: 0 0 6px; }
  .set-group h3 small { font-size: 11px; font-weight: 400; opacity: .7; } .set-group h3 small::before { content: " · "; }
  .set-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .set-opt { flex: 1 1 0; min-width: 0; padding: 7px 8px; border-radius: 999px; border: 1.5px solid #2B2620; background: #fff; color: #2B2620; font: inherit; font-size: 14px; line-height: 1.25; cursor: pointer; }
  .set-opt small { display: block; font-size: 10.5px; opacity: .8; }
  .set-opts.two .set-opt { flex: 1 1 40%; }
  .set-opt.on { background: #2B2620; color: #fff; font-weight: 700; }
  .set-done { margin-top: 6px; padding: 10px 26px; border-radius: 999px; border: 0; background: #2B2620; color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
  html[data-ui="zh"] .sub { display: none; }
  #card .c-py { font-size: 16px; color: #2f5fa7; }
  #card .c-tr { font-size: 15px; margin-top: 6px; }
  #card .c-hint { font-size: 13px; color: #cf3a24; margin-top: 6px; }
  #card .c-btns { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  #card button { border: 2px solid #1b1a22; border-radius: 999px; background: #fff; padding: 4px 14px; font-size: 15px; }
  canvas:focus { outline: none; }
  canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; border: 4px solid #1b1a22; border-radius: 10px; background: #6bb05a; touch-action: manipulation; }
  #help { color: #cfe3c8; font-size: 12px; line-height: 1.3; padding: 3px 12px; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px); background: #1b1a22; color: #fff; padding: 10px 18px; border-radius: 12px; opacity: 0; transition: .25s; pointer-events: none; z-index: 30; max-width: 90vw; text-align: center; white-space: pre-line; }
  #toast.show { opacity: 1; transform: translateX(-50%); }


  /* ── 遊戲視窗 ── */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; flex-direction: column; align-items: center; z-index: 20; }
  #overlay.on { display: flex; }
  #ov-bar { width: 100%; max-width: 980px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: #fff; }
  #ov-bar b { margin-right: auto; }
  #ov-bar button { background: #fff; border: 2px solid #1b1a22; border-radius: 999px; padding: 4px 14px; font-size: 15px; }
  #frame { flex: 1; width: 100%; max-width: 980px; border: 0; background: #fff; border-radius: 10px 10px 0 0; }
</style>
</head>

<!-- 玩家代碼、Firebase（進度上傳）：shared/ 共用檔 -->
<script src="shared/player.js"></script>
<script type="module">
  import { initFB } from "./shared/firebase.js";
  initFB();
</script>
<script>
/* ══════════════════════════════════════
   背景音樂：程式即時合成的 8-bit 小曲，不需要音檔
   🎵 按鈕開關（所有遊戲和地圖共用設定）；中文朗讀時自動變小聲；切到別的分頁就暫停
══════════════════════════════════════ */
const Music = {
  KEY: 'taiwan_music', VOL: 0.12,
  on: true, ctx: null, master: null, timer: null, step: 0, nextT: 0, song: null, ducked: false, events: null,
  init(song) {
    this.song = song;
    try { if (localStorage.getItem(this.KEY) === 'off') this.on = false; } catch (e) {}
    this.events = song.tracks.map(tr => this.parse(tr.notes));
    this.paint();
    const go = () => { if (this.on) this.start(); };
    addEventListener('pointerdown', go, { once: true }); addEventListener('keydown', go, { once: true });
    document.addEventListener('visibilitychange', () => { if (this.ctx) document.hidden ? this.ctx.suspend() : (this.on && this.timer && this.ctx.resume()); });
  },
  /* 一個字代表一個八分音符：C5、F#4、Bb3＝音；-＝延長；.＝休止；k s h＝大鼓、小鼓、鈸 */
  parse(str) {
    const tk = str.split(/\s+/).filter(x => x && x !== '|'), ev = [];
    const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    tk.forEach((x, i) => {
      if (x === '-' || x === '.') return;
      let len = 1; while (tk[i + len] === '-') len++;
      const m = x.match(/^([A-G])([#b]?)(\d)$/);
      ev[i] = m ? { midi: 12 * (+m[3] + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0), len } : { drum: x, len };
    });
    ev.n = tk.length; return ev;
  },
  start() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.3, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    this.ctx.resume();
    this.fade(this.ducked ? 0.15 : 1);
    if (!this.timer) { this.step = 0; this.nextT = this.ctx.currentTime + 0.1; this.timer = setInterval(() => this.tick(), 60); }
  },
  stop() { if (!this.ctx) return; this.fade(0); clearInterval(this.timer); this.timer = null; },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem(this.KEY, this.on ? 'on' : 'off'); } catch (e) {}
    this.on ? this.start() : this.stop(); this.paint();
  },
  duck(d) { this.ducked = d; if (this.ctx && this.on && this.timer) this.fade(d ? 0.15 : 1); },
  fade(x) { const g = this.master.gain, t = this.ctx.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(x * this.VOL, t, 0.12); },
  paint() {
    const b = document.getElementById('btn-music'); if (!b) return;
    b.textContent = this.on ? '🎵' : '🔇';
    b.title = this.on ? '關掉音樂 · Silenciar música' : '打開音樂 · Activar música'; b.setAttribute('aria-label', b.title);
  },
  tick() {
    const s = this.song, d = 60 / s.bpm / 2;
    while (this.nextT < this.ctx.currentTime + 0.3) {
      s.tracks.forEach((tr, k) => { const ev = this.events[k], e = ev[this.step % ev.n]; if (e) this.play(tr, e, this.nextT, d); });
      this.nextT += d; this.step++;
    }
  },
  play(tr, e, t, d) {
    const c = this.ctx, g = c.createGain(); g.connect(this.master);
    const v = tr.vol ?? 0.5;
    if (e.drum) {
      if (e.drum === 'k') {
        const o = c.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
        g.gain.setValueAtTime(v * 1.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.connect(g); o.start(t); o.stop(t + 0.16);
      } else {
        const n = c.createBufferSource(), f = c.createBiquadFilter(); n.buffer = this.noise;
        f.type = 'highpass'; f.frequency.value = e.drum === 'h' ? 7000 : 1800;
        const dur = e.drum === 'h' ? 0.04 : 0.1;
        g.gain.setValueAtTime(v * (e.drum === 'h' ? 0.35 : 0.7), t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        n.connect(f); f.connect(g); n.start(t); n.stop(t + dur + 0.01);
      }
      return;
    }
    const o = c.createOscillator(), len = e.len * d * 0.92;
    o.type = tr.wave || 'square'; o.frequency.value = 440 * Math.pow(2, (e.midi - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01);
    g.gain.setValueAtTime(v * 0.7, t + Math.min(0.08, len * 0.5)); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); o.start(t); o.stop(t + len + 0.02);
  }
};

/* ══════════════════════════════════════
   場景（folder = scene = postMessage 的 scene）
   新增遊戲：在 SCENES 加一筆，並放在 BUILD_SLOTS 的空位
══════════════════════════════════════ */
const SCENES = [
  { id: 'drinks',      zh: '飲料店',   es: 'Tienda de bebidas',  en: 'Drink shop',       emoji: '🧋', roof: '#e0689a', wall: '#f7d6e4', slot: 0 },
  { id: 'breakfast',   zh: '早餐店',   es: 'Desayunería',        en: 'Breakfast shop',   emoji: '🍳', roof: '#e8a53a', wall: '#fbe9c4', slot: 1 },
  { id: 'bakery',      zh: '麵包店',   es: 'Panadería',          en: 'Bakery',           emoji: '🥐', roof: '#b9763f', wall: '#f1dcc2', slot: 2 },
  { id: 'clinic',      zh: '診所',     es: 'Clínica',            en: 'Clinic',           emoji: '🏥', roof: '#2a8d9f', wall: '#dff1f2', slot: 3 },
  { id: 'parcel',      zh: '便利商店', es: 'Tienda 24 h',        en: 'Convenience store',emoji: '📦', roof: '#3f9a5b', wall: '#dff0e2', slot: 4 },
  { id: 'nightmarket', zh: '夜市',     es: 'Mercado nocturno',   en: 'Night market',     emoji: '🏮', roof: '#c4382f', wall: '#f4d3cf', slot: 5 },
  { id: 'reserva',     zh: '我家',     es: 'Mi casa (teléfono)', en: 'Home (phone call)',emoji: '📞', roof: '#7a62c4', wall: '#e5defa', slot: 6 },
  { id: 'mrt',         zh: '捷運站',   es: 'Estación de metro',  en: 'MRT station',      emoji: '🚇', roof: '#2f5fa7', wall: '#dbe5f6', slot: 7 },
  { id: 'school',  zh: '學校',   es: 'Escuela',    en: 'School',      emoji: '🏫', roof: '#b0a07a', wall: '#ece6d6', slot: 8, gated: true },
  { id: 'bus',     zh: '公車',   es: 'Autobús',    en: 'Bus',         emoji: '🚌', roof: '#e07a2f', wall: '#fbe3cc', slot: 11, gated: true },
  { id: 'ubike',   zh: 'YouBike', es: 'YouBike',   en: 'YouBike',     emoji: '🚲', roof: '#c9b21f', wall: '#f6f0c4', slot: 14, gated: true },
  { id: 'barber',  zh: '理髮店', es: 'Peluquería', en: 'Barbershop',  emoji: '💈', roof: '#b03a48', wall: '#f7e1e3', slot: 15, gated: true },
  { id: 'cinema',    zh: '電影院',   es: 'Cine',            en: 'Cinema',         emoji: '🎬', roof: '#7a4f96', wall: '#e9e0ea', slot: 9, gated: true },
  { id: 'market',    zh: '菜市場',   es: 'Mercado',         en: 'Market',         emoji: '🥬', roof: '#5d9a3c', wall: '#e1eadb', slot: 10, gated: true },
  { id: 'parking',   zh: '停車場',   es: 'Estacionamiento', en: 'Parking lot',    emoji: '🅿️', roof: '#2f8f8a', wall: '#dcefee', slot: 16, gated: true },
  { id: 'icecream',  zh: '冰淇淋店', es: 'Heladería',       en: 'Ice cream shop', emoji: '🍦', roof: '#d9507f', wall: '#fbe4ec', slot: 17, gated: true },
  { id: 'bookstore', zh: '書店',     es: 'Librería',        en: 'Bookstore',      emoji: '📚', roof: '#3b6ea5', wall: '#e3ecf7', slot: 18, gated: true },
  { id: 'elevator',  zh: '搭電梯',   es: 'Ascensor',        en: 'Elevator',       emoji: '🛗', roof: '#6b7a99', wall: '#e4e8f1', slot: 19, gated: true },
  /* 沒有建築的場景：路上會隨機冒出「❗」，走過去就觸發 */
  { id: 'street',      zh: '路上突發事件', es: 'Imprevistos en la calle', en: 'Street surprises', emoji: '❗', virtual: true }
];
/* 還不能玩的地點（不算進星星）
   soon：🚧 維修中（有房子）；build：建造中（工地）。走到門口只會顯示「還在準備中，敬請期待」
   之後要開放：把它搬到 SCENES，slot 不變 */
/* gated：新遊戲預設「維修中」，管理員頁的「地圖開關」打開後才能進去（設定存在 Firebase settings/map） */
const OPEN = {};
const isLive = sc => !sc.gated || !!OPEN[sc.id];
const liveScenes = () => SCENES.filter(isLive);
const COMING = [
  { id: 'airport', zh: '機場',   es: 'Aeropuerto', en: 'Airport',     emoji: '✈️', roof: '#8697ad', wall: '#e2e8f0', slot: 12, status: 'soon' },

function readShared() {
  let sv = null;
  try { sv = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) {}
  if (sv && typeof sv === 'object') { Object.keys(SET_OPTS).forEach(k => { if (SET_OPTS[k].includes(sv[k])) S[k] = sv[k]; }); return true; }
  return false;
}
function writeShared() {
  try {
    let cur = {};
    try { cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (e) {}
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v: 1, script: S.script, lang: S.lang, phon: S.phon, rate: S.rate })));
  } catch (e) {}
}
function load() {
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  if (!readShared()) writeShared();      // 第一次：把原本的設定寫成共用設定
  if (!SET_OPTS.lang.includes(S.lang)) S.lang = 'es';
}

/* ── 進度存到 Firebase：progress/<玩家代碼>，換裝置輸入代碼就能讀回 ── */
function pushProgress() {
  if (!S.code) return;
  TWFB.when(fb => fb.saveProgress(S.code, { name: S.name, done: S.done }));
}
/* 每個地點記「最好的紀錄」：最高分、最少錯誤（兩個分開記，所以星星和分數都只會變好） */
function bestOf(a, b) {
  if (!a) return { score: b.score, mistakes: b.mistakes || 0 };
  return { score: Math.max(a.score, b.score), mistakes: Math.min(a.mistakes || 0, b.mistakes || 0) };
}
/* 星星：0 次錯誤 3 顆、1–5 次 2 顆、6 次以上 1 顆；沒玩過 0 顆 */
function starsOf(r) { return !r ? 0 : (r.mistakes || 0) === 0 ? 3 : r.mistakes <= 5 ? 2 : 1; }
function starText(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
/* 兩邊的進度合在一起（例如換裝置） */
function mergeDone(a, b) {
  const out = { ...a };
  for (const [k, v] of Object.entries(b || {})) if (v && typeof v.score === 'number') out[k] = bestOf(out[k], v);
  return out;
}
/* 打開地圖時，把雲端的進度合進來（例如在別的裝置玩過） */
function pullProgress() {
  if (!S.code) return;
  const code = S.code;
  TWFB.when(async fb => {
    let d = null; try { d = await fb.getProgress(code); } catch (e) { return; }
    if (code !== S.code) return;
    if (!d) { pushProgress(); return; }
    const merged = mergeDone(S.done, d.done);
    const changed = JSON.stringify(merged) !== JSON.stringify(S.done);
    S.done = merged; save(); if (changed) updateHud();
    if (JSON.stringify(merged) !== JSON.stringify(d.done || {}) || d.name !== S.name) pushProgress();
  });
}

/* ── 車：機車和汽車，靠右行駛；遇到人會停下來按喇叭 ── */
const VEHICLES = [
  { axis: 'h', lane: 5, dir: -1, pos: 500, speed: 64, kind: 'scooter', color: '#e94f37' },
  { axis: 'h', lane: 6, dir: 1, pos: 120, speed: 52, kind: 'car', color: '#f2c14e' },
  { axis: 'v', lane: 9, dir: 1, pos: -40, speed: 62, kind: 'scooter', color: '#59cd90', idle: 6 },
  { axis: 'h', lane: 19, dir: -1, pos: 300, speed: 58, kind: 'car', color: '#5b8def' },
  { axis: 'h', lane: 20, dir: 1, pos: 40, speed: 66, kind: 'scooter', color: '#f28c28', idle: 3 },
  { axis: 'v', lane: 10, dir: -1, pos: 900, speed: 60, kind: 'scooter', color: '#b06ad8', idle: 9 },
  { axis: 'h', lane: 33, dir: -1, pos: 420, speed: 60, kind: 'scooter', color: '#2fb5a3', idle: 2 },
  { axis: 'h', lane: 34, dir: 1, pos: 200, speed: 55, kind: 'car', color: '#d95b5b', idle: 4 }
].map(v => ({ idle: 0, ...v, half: v.kind === 'car' ? 22 : 13, wait: 0 }));
const W = COLS * T, H = ROWS * T; let VH = VIEW_ROWS * T;
/* 路口：直的馬路（第 9、10 行）和每條橫向馬路交叉的地方，橫向和直向的車不能同時在裡面 */
const XBOX = [9 * T, 11 * T];
const CROSSINGS = [[5, 6], [19, 20], [33, 34]].map(r => ({ rows: r, box: [r[0] * T, (r[1] + 1) * T] }));

/* ── 看得到的突發事件：走到旁邊就開始「走在路上」，第一件就是你看到的那件 ── */
const EVENT_TYPES = ['elder', 'fall', 'ask', 'wallet', 'flyer'];
const EVENT_LINES = {
  elder:  ['ama', ['哎喲，這個綠燈好短喔……', '哎哟，这个绿灯好短喔……', 'āi yō, zhè ge lǜ dēng hǎo duǎn ō……', 'Ay, este semáforo en verde dura muy poco…', 'Oh my, this green light is so short…']],
  fall:   ['agong', ['哎喲……好痛……', '哎哟……好痛……', 'āi yō…… hǎo tòng……', 'Ay… me duele…', 'Ouch… it hurts…']],
  ask:    ['walker', ['請問，捷運站怎麼走？', '请问，捷运站怎么走？', 'qǐng wèn, jié yùn zhàn zěn me zǒu?', 'Disculpe, ¿cómo llego a la estación de metro?', 'Excuse me, how do I get to the MRT station?']],
  wallet: ['me', ['前面那個人的錢包掉了！', '前面那个人的钱包掉了！', 'qián mian nà ge rén de qián bāo diào le!', '¡A la persona de adelante se le cayó la billetera!', 'The person ahead dropped their wallet!']],
  flyer:  ['flyer', ['您好，新開的餐廳，請看一下！', '您好，新开的餐厅，请看一下！', 'nín hǎo, xīn kāi de cān tīng, qǐng kàn yí xià!', 'Hola, es un restaurante nuevo, ¡échele un vistazo!', "Hello, it's a new restaurant — take a look!"]]
};
const STREET = SCENES.find(sc => sc.virtual);
const EV = { type: 'fall', x: 0, y: 0, y0: 4, dir: 1, pause: 0 };
const sidewalkOk = (x, y) => isWalk(x, y) && SIDEWALK_ROWS.includes(y) && !isRoad(x, y) && !doors[x + ',' + (y - 1)] && !doors[x + ',' + y];
function respawnEvent(ax, ay) {
  EV.type = EVENT_TYPES[Math.floor(Math.random() * EVENT_TYPES.length)];
  const cand = [];
  if (EV.type === 'elder') {
    // 阿嬤在斑馬線上，慢慢從上面的人行道走到下面
    for (const top of [4, 18, 32]) for (const x of [2, 3, 6, 7, 13, 14, 16, 17]) if (Math.abs(x - ax) + Math.abs(top + 1 - ay) >= 5) cand.push([x, top]);
  } else {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
      if (sidewalkOk(x, y) && Math.abs(x - ax) + Math.abs(y - ay) >= 5 && Math.abs(x - AMI.x) + Math.abs(y - AMI.y) > 2 &&
          (EV.type !== 'wallet' || sidewalkOk(x + 2, y))) cand.push([x, y]);
  }
  const c = cand[Math.floor(Math.random() * cand.length)] || [3, 7];
  EV.x = c[0]; EV.y = c[1]; EV.y0 = c[1]; EV.dir = 1; EV.pause = 1.2;
}
const evTile = () => ({ x: Math.round(EV.x), y: Math.round(EV.y) });

/* ── 更新：行人、車、阿嬤 ── */
function playerTile() { return P.moving ? P.moving.to : { x: P.x, y: P.y }; }
function updateLife(dt) {
  const pt = playerTile();
  for (const w of WALKERS) {
    w.phase += dt;
    if (w.pause > 0) { w.pause -= dt; continue; }
    const ahead = pt.y === w.row && (pt.x + 0.5 - (w.x + 0.5)) * w.dir > 0 && Math.abs(pt.x - w.x) < 1.1;
    if (ahead) { w.pause = 0.6; continue; }
    w.x += w.dir * w.speed * dt;
    if (w.x <= w.x0) { w.x = w.x0; w.dir = 1; w.pause = 1 + Math.random() * 2; }
    if (w.x >= w.x1) { w.x = w.x1; w.dir = -1; w.pause = 1 + Math.random() * 2; }
    if (Math.random() < dt * 0.08) w.pause = 1.5 + Math.random() * 2;
  }
  if (EV.type === 'elder') {
    if (EV.pause > 0) EV.pause -= dt;
    else {
      EV.y += EV.dir * 0.45 * dt;
      if (EV.y >= EV.y0 + 3) { EV.y = EV.y0 + 3; EV.dir = -1; EV.pause = 2.5; }
      if (EV.y <= EV.y0) { EV.y = EV.y0; EV.dir = 1; EV.pause = 2.5; }
    }
  }
  // 路上會擋車的人（玩家、過馬路的阿嬤）：格子座標
  const people = [pt];
  if (EV.type === 'elder') people.push({ x: EV.x, y: EV.y, elder: true });
  // 車 o 是不是在第 k 個路口裡
  const inBox = (o, k) => {
    if (o.idle > 0) return false;
    const c = CROSSINGS[k];
    if (o.axis === 'h') return c.rows.includes(o.lane) && o.pos + o.half > XBOX[0] && o.pos - o.half < XBOX[1];
    return o.pos + o.half > c.box[0] && o.pos - o.half < c.box[1];
  };
  for (const v of VEHICLES) {
    if (v.idle > 0) { v.idle -= dt; continue; }      // 在畫面外等一下才開進來
    const front = v.pos + v.dir * v.half;
    let stop = false, byPlayer = false;
    for (const o of VEHICLES) if (o !== v && o.axis === v.axis && o.lane === v.lane) {
      const d = (o.pos - v.pos) * v.dir;
      if (d > 0 && d < v.half + o.half + 10) stop = true;
    }
    for (const p of people) {
      const onLane = v.axis === 'h' ? Math.abs(p.y - v.lane) < 0.6 : Math.abs(p.x - v.lane) < 0.6;
      if (!onLane) continue;
      const c = (v.axis === 'h' ? p.x : p.y) * T + T / 2;
      const d = (c - front) * v.dir;
      if (d > -8 && d < 26) { stop = true; if (!p.elder) byPlayer = true; }
    }
    // 路口：橫向和直向的車不能同時在路口裡
    const next = front + v.dir * v.speed * dt;
    CROSSINGS.forEach((c, k) => {
      if (v.axis === 'h' && !c.rows.includes(v.lane)) return;
      const box = v.axis === 'h' ? XBOX : c.box;
      const entering = !inBox(v, k) && (v.dir > 0 ? (front <= box[0] && next > box[0] - 4) : (front >= box[1] && next < box[1] + 4));
      if (entering && VEHICLES.some(o => o.axis !== v.axis && inBox(o, k))) stop = true;
    });
    if (!stop) v.pos += v.dir * v.speed * dt;
    v.wait = byPlayer ? v.wait + dt : 0;
    const len = v.axis === 'h' ? W : H;
    if (v.pos > len + 40 || v.pos < -40) { v.pos = v.dir > 0 ? -40 : len + 40; v.idle = 5 + Math.random() * 10; }
  }
}
/* 走到突發事件旁邊（相鄰一格以內）停下來就開始 */
function checkEvent() {
  // 只有停在旁邊（或點它走過去）才開始；路過不會被打斷
  if (current || P.moving || P.locked || P.path.length || P.held) return;
  const e = evTile(), d = Math.abs(e.x - P.x) + Math.abs(e.y - P.y);
  if (d <= 1) { P.path = []; P.held = null; openGame({ sc: STREET, out: { x: P.x, y: P.y }, first: EV.type }); }
}

/* ── 繪圖：人物、車、事件 ── */
function drawPerson(px, py, o) {
  // px, py：格子左上角
  const leg = o.leg || 0;
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(px + 9, py + 28, 14, 3);
  if (o.lying) {   // 跌倒：躺在地上
    g.fillStyle = o.pants; g.fillRect(px + 2, py + 20, 12, 6);
    g.fillStyle = o.shirt; g.fillRect(px + 12, py + 18, 12, 9);
    g.fillStyle = '#f1c9a0'; g.fillRect(px + 23, py + 17, 8, 9);
    g.fillStyle = o.hair; g.fillRect(px + 27, py + 16, 4, 10);
    g.fillStyle = '#7a4e2b'; g.fillRect(px + 4, py + 28, 18, 2);   // 拐杖
    return;
  }
  g.fillStyle = o.pants; g.fillRect(px + 11, py + 22, 4, 7 - (leg ? 2 : 0)); g.fillRect(px + 17, py + 22, 4, 7 - (leg ? 0 : 2));
  g.fillStyle = o.shirt; g.fillRect(px + 9, py + 13, 14, 10);
  if (o.inner) { g.fillStyle = o.inner; g.fillRect(px + 14, py + 13, 4, 6); }
  if (o.vest) { g.fillStyle = o.vest; g.fillRect(px + 9, py + 13, 4, 10); g.fillRect(px + 19, py + 13, 4, 10); }
  g.fillStyle = '#f1c9a0'; g.fillRect(px + 7, py + 15, 3, 6); g.fillRect(px + 22, py + 15, 3, 6);
  g.fillRect(px + 10, py + 4, 12, 10);
  g.fillStyle = o.hair; g.fillRect(px + 9, py + 2, 14, 4);
  if (o.long) { g.fillRect(px + 8, py + 4, 3, 13); g.fillRect(px + 21, py + 4, 3, 13); }
  else { g.fillRect(px + 9, py + 4, 2, 5); g.fillRect(px + 21, py + 4, 2, 5); }
  g.fillStyle = '#1b1a22';
  const ox = o.dir < 0 ? -2 : o.dir > 0 ? 2 : 0;
  g.fillRect(px + 13 + ox, py + 8, 2, 2); g.fillRect(px + 17 + ox, py + 8, 2, 2);
  if (o.bag) { g.fillStyle = '#8b5a2b'; g.fillRect(px + 21, py + 18, 5, 5); }
  if (o.basket) { g.fillStyle = '#c8a165'; g.fillRect(px + 22, py + 18, 8, 6); g.fillStyle = '#4caf50'; g.fillRect(px + 23, py + 16, 6, 3); }
  if (o.cane) { g.fillStyle = '#7a4e2b'; g.fillRect(px + 5, py + 17, 2, 12); }
  if (o.phone) { g.fillStyle = '#222'; g.fillRect(px + 23, py + 13, 4, 6); }
  if (o.paper) { g.fillStyle = '#fff'; g.fillRect(px + 22, py + 12, 8, 7); g.fillStyle = '#e94f37'; g.fillRect(px + 23, py + 13, 6, 2); }
}
function drawVehicle(v) {
  g.save();
  const cx = v.axis === 'h' ? v.pos : v.lane * T + T / 2, cy = v.axis === 'h' ? v.lane * T + T / 2 : v.pos;
  g.translate(cx, cy);
  if (v.axis === 'v') g.rotate(Math.PI / 2);
  if (v.dir < 0) g.scale(-1, 1);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(-v.half, 6, v.half * 2, 4);
  if (v.kind === 'car') {
    g.fillStyle = v.color; g.fillRect(-22, -9, 44, 18);
    g.fillStyle = '#9fd2ee'; g.fillRect(2, -7, 9, 14); g.fillRect(-16, -7, 6, 14);
    g.fillStyle = '#1b1a22'; g.fillRect(-16, -11, 8, 3); g.fillRect(8, -11, 8, 3); g.fillRect(-16, 8, 8, 3); g.fillRect(8, 8, 8, 3);
    g.fillStyle = '#fff6a0'; g.fillRect(20, -7, 2, 4); g.fillRect(20, 3, 2, 4);
  } else {
    g.fillStyle = '#1b1a22'; g.fillRect(-12, 3, 6, 5); g.fillRect(6, 3, 6, 5);
    g.fillStyle = v.color; g.fillRect(-10, -2, 22, 6);
    g.fillStyle = '#ccc'; g.fillRect(8, -8, 3, 7);
    g.fillStyle = '#3a3a3a'; g.fillRect(-6, -10, 9, 9);          // 騎士
    g.fillStyle = v.color; g.fillRect(-5, -16, 8, 7);              // 安全帽
  }
  g.restore();
  if (v.wait > 0.5) {   // 按喇叭
    const k = Math.floor(v.wait * 4) % 2;
    g.fillStyle = '#f2d24b'; g.font = 'bold 12px sans-serif'; g.textAlign = 'center';
    g.fillText(k ? '))' : ')))', cx + (v.axis === 'h' ? v.dir * 18 : 12), cy - 14);
  }
}
function drawEventScene(now) {
  const t = EV.type, px = EV.x * T, py = EV.y * T;
  if (t === 'elder') drawPerson(px, py - Math.abs(Math.sin(now / 300)) * 1, { ...OLD_LOOK, basket: true, dir: 0, leg: EV.pause > 0 ? 0 : Math.floor(now / 400) % 2 });
  if (t === 'fall') {
    drawPerson(px, py, { ...OLD_LOOK, lying: true });
    g.fillStyle = '#f2d24b'; const a = now / 300;
    for (let i = 0; i < 3; i++) g.fillRect(px + 26 + Math.cos(a + i * 2.1) * 8, py + 12 + Math.sin(a + i * 2.1) * 3, 3, 3);
  }
  if (t === 'ask') drawPerson(px, py, { ...LOOKS[0], shirt: '#ff8c42', phone: true, dir: 0 });
  if (t === 'flyer') drawPerson(px, py, { ...LOOKS[2], shirt: '#ffffff', vest: '#ff5d8f', paper: true, dir: 0, leg: Math.floor(now / 500) % 2 });
  if (t === 'wallet') {
    g.fillStyle = '#7b4a26'; g.fillRect(px + 10, py + 22, 12, 8); g.fillStyle = '#a8703f'; g.fillRect(px + 10, py + 22, 12, 3);
    drawPerson(px + 2 * T, py, { ...LOOKS[1], long: false, dir: 1, leg: Math.floor(now / 300) % 2 });
  }
  // ❗ 提示
  const bx = px + T / 2, by = py - 6 - Math.abs(Math.sin(now / 220)) * 4;
  g.fillStyle = '#f2b632'; g.beginPath(); g.arc(bx, by, 8, 0, 7); g.fill();
  g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#1b1a22'; g.font = 'bold 12px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', bx, by + 1);
}
function drawLife(now) {
  VEHICLES.forEach(drawVehicle);
  const items = WALKERS.map(w => ({ y: w.row, f: () => drawPerson(w.x * T, w.row * T, { ...w.look, dir: w.dir, leg: w.pause > 0 ? 0 : Math.floor(w.phase * 4) % 2 }) }));
  items.push({ y: AMI.y, f: () => drawPerson(AMI.x * T, AMI.y * T, { ...AMI_LOOK, dir: 0 }) });
  items.push({ y: EV.y, f: () => drawEventScene(now) });
  items.sort((a, b) => a.y - b.y).forEach(i => i.f());
}

/* ══════════════════════════════════════
   對話泡泡：靠近的人頭上冒出中文；點一下看拼音和翻譯
══════════════════════════════════════ */
const bub = document.getElementById('bubble'), card = document.getElementById('card');
let bubNow = null;
const zhOf = line => S.script === 'simp' ? line[1] : line[0];
function speakers() {
  const pt = { x: P.x, y: P.y }, out = [];
  const dist = (x, y) => Math.hypot(x - pt.x, y - pt.y);
  out.push({ key: 'ami', who: 'ami', line: amiLine(), x: AMI.x, y: AMI.y, d: dist(AMI.x, AMI.y), r: 1.6 });
  WALKERS.forEach((w, i) => out.push({ key: 'w' + i, who: 'walker', line: LINES[w.line], x: w.x, y: w.row, d: dist(w.x, w.row), r: 1.6 }));
  const [ew, el] = EVENT_LINES[EV.type];
  out.push({ key: 'ev', who: ew, line: el, x: EV.x, y: EV.y, d: dist(EV.x, EV.y), r: 3, ev: true });
  VEHICLES.forEach((v, i) => { if (v.wait > 0.5) out.push({ key: 'v' + i, who: 'rider', line: LINES.honk, x: (v.axis === 'h' ? v.pos / T - 0.5 : v.lane), y: (v.axis === 'h' ? v.lane : v.pos / T - 0.5), d: 0, r: 9 }); });
  return out.filter(s => s.d <= s.r).sort((a, b) => a.d - b.d);
}
function updateBubble() {
  const s = current ? null : speakers().find(o => o.y * T - camY > -T / 2 && o.y * T - camY < VH - T / 2);   // 只看畫面裡的人
  if (!s) { bub.hidden = true; bubNow = null; return; }
  bubNow = s;
  const w = WHO[s.who], who = S.script === 'simp' ? w[1] : w[0];
  const html = `<small>${who}</small>${zhOf(s.line)}<i>${s.ev ? '❗ ' : ''}🔤</i>`;
  if (bub.dataset.k !== s.key + S.script + zhOf(s.line)) { bub.innerHTML = html; bub.dataset.k = s.key + S.script + zhOf(s.line); }
  bub.hidden = false;
  const r = cv.getBoundingClientRect(), st = document.getElementById('stage').getBoundingClientRect();
  const sx = r.width / W, cx = r.left - st.left + (s.x * T + T / 2) * sx, top = r.top - st.top + (s.y * T - camY) * sx;
  const bw = bub.offsetWidth;
  bub.style.left = Math.max(4, Math.min(st.width - bw - 4, cx - bw / 2)) + 'px';
  bub.style.top = (top - bub.offsetHeight - 4) + 'px';
  bub.style.setProperty('--tail', (cx - parseFloat(bub.style.left)) + 'px');
}
function openCard(s) {
  if (!s) return;
  const w = WHO[s.who];
  card.querySelector('.c-who').textContent = (S.script === 'simp' ? w[1] : w[0]) + ' · ' + X(w[2], w[3]);
  card.querySelector('.c-zh').textContent = zhOf(s.line);
  card.querySelector('.c-py').textContent = S.phon === 'off' ? '' : S.phon === 'zhuyin' ? ZY.conv(s.line[2]) : S.phon === 'both' ? s.line[2] + '　' + ZY.conv(s.line[2]) : s.line[2];
  card.querySelector('.c-tr').textContent = X(s.line[3], s.line[4]);
  card.querySelector('.c-tr').style.display = S.lang === 'zh' ? 'none' : '';
  card.querySelector('.c-hint').textContent = s.ev ? X('Acércate (a una casilla) para ayudar.', 'Walk next to them to help.') : '';
  card.dataset.say = s.line[0];
  card.hidden = false;
}
bub.addEventListener('pointerdown', e => { e.stopPropagation(); });
bub.addEventListener('click', e => { e.stopPropagation(); openCard(bubNow); });
card.querySelector('.c-close').onclick = () => { card.hidden = true; try { speechSynthesis.cancel(); } catch (e) {} };
function say(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[（）()]/g, ''));
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang) && !/^(yue|zh[-_]hk)/i.test(v.lang));   // 排除廣東話
    u.lang = v ? v.lang : 'zh-TW'; if (v) u.voice = v; u.rate = RATE_VALUE[S.rate];
    Music.duck(true); u.onend = u.onerror = () => Music.duck(false);
    speechSynthesis.speak(u);
  } catch (e) {}
}
card.querySelector('.c-say').onclick = () => say(card.dataset.say);

/* ══════════════════════════════════════
   玩家與移動
══════════════════════════════════════ */
const P = { x: 8, y: 4, dir: 'down', moving: null, path: [], step: 0, held: null, locked: false };
const STEP_MS = 140;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function bfs(sx, sy, tx, ty) {
  if (!isWalk(tx, ty)) return null;
  const q = [[sx, sy]], prev = { [sx + ',' + sy]: null };
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) {
      const out = []; let k = x + ',' + y;
      while (prev[k]) { const [px, py] = prev[k].split(',').map(Number); out.unshift({ x: +k.split(',')[0], y: +k.split(',')[1] }); k = prev[k]; }
      return out;
    }
    for (const d of Object.values(DIRS)) {
      const nx = x + d[0], ny = y + d[1], nk = nx + ',' + ny;
      if (isWalk(nx, ny) && !(nk in prev)) { prev[nk] = x + ',' + y; q.push([nx, ny]); }
    }
  }
  return null;
}
function goTo(tx, ty) {
  const b = Object.values(doors).find(d => blocked[ty] && blocked[ty][tx] && tx >= d.x && tx < d.x + d.w && ty >= d.y && ty < d.y + d.h);
  if (b) { tx = b.door.x; ty = b.door.y; }              // 點到建築 → 走到它的門
  const from = P.moving ? P.moving.to : { x: P.x, y: P.y };
  const p = bfs(from.x, from.y, tx, ty);
  if (p) P.path = p;
}

/* 省電：每秒最多畫 30 次；玩遊戲（地圖被蓋住）時完全不畫；
   切到別的分頁時，瀏覽器本來就會暫停 requestAnimationFrame */
let _last = 0;
function tick(now) {
  if (current || now - _last < 32) { if (current) _last = now; requestAnimationFrame(tick); return; }
  const dt = Math.min(0.05, ((now - (_last || now)) / 1000)); _last = now;
  updateLife(dt);
  if (!P.moving && !P.locked) {
    let d = null;
    if (P.held) d = P.held;
    else if (P.path.length) {
      const n = P.path[0];
      d = n.x > P.x ? 'right' : n.x < P.x ? 'left' : n.y > P.y ? 'down' : 'up';
    }
    if (d) {
      P.dir = d;
      const nx = P.x + DIRS[d][0], ny = P.y + DIRS[d][1];
      if (isWalk(nx, ny)) { P.moving = { from: { x: P.x, y: P.y }, to: { x: nx, y: ny }, t0: now }; if (P.path.length) P.path.shift(); }
      else P.path = [];
    }
  }
  if (P.moving) {
    const k = (now - P.moving.t0) / STEP_MS;
    if (k >= 1) {
      P.x = P.moving.to.x; P.y = P.moving.to.y; P.moving = null; P.step++;
      const b = doors[P.x + ',' + P.y];
      if (b) { P.path = []; P.held = null; if (b.soon) comingSoon(b); else openGame(b); }
    }
  }
  checkEvent();
  updateCamera(now, dt);
  draw(now);
  updateBubble();
  requestAnimationFrame(tick);
}

/* ══════════════════════════════════════
   繪圖（全部用程式畫成像素風格，不需要圖片）
══════════════════════════════════════ */
const cv = document.getElementById('cv'); let g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const rnd = (x, y, k = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453; return v - Math.floor(v); };

function drawGround() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = x * T, py = y * T;
    if (isRoad(x, y)) {
      g.fillStyle = '#4a4d55'; g.fillRect(px, py, T, T);
      g.fillStyle = '#555963'; for (let i = 0; i < 4; i++) g.fillRect(px + rnd(x, y, i) * 28, py + rnd(y, x, i) * 28, 3, 2);
      // 中線
      g.fillStyle = '#f2d24b';
      if (CENTER_ROWS.includes(y) && !ROAD_COLS.includes(x)) g.fillRect(px + 4, py + T - 2, 12, 4);
      if (x === 9 && !ROAD_ROWS.includes(y)) g.fillRect(px + T - 2, py + 4, 4, 12);
    } else if (SIDEWALK_ROWS.includes(y)) {
      g.fillStyle = '#cfcab8'; g.fillRect(px, py, T, T);
      g.fillStyle = '#bdb8a5'; g.fillRect(px, py + T - 2, T, 2); g.fillRect(px + T - 2, py, 2, T);
    } else {
      g.fillStyle = (x + y) % 2 ? '#6bb05a' : '#68ac57'; g.fillRect(px, py, T, T);
      g.fillStyle = '#58994a';
      for (let i = 0; i < 3; i++) { const r = rnd(x, y, i); g.fillRect(px + r * 26, py + rnd(y, x, i + 5) * 26, 2, 4); }
      if (rnd(x, y, 9) > .93) { g.fillStyle = '#f7e36a'; g.fillRect(px + 10, py + 12, 4, 4); g.fillStyle = '#fff'; g.fillRect(px + 12, py + 10, 2, 2); }
    }
  }
}

function drawTree(t) {
  const px = t.x * T, py = t.y * T;
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(px + 6, py + 26, 20, 4);
  g.fillStyle = '#7a4e2b'; g.fillRect(px + 13, py + 18, 6, 11);
  g.fillStyle = '#2f7d3a'; g.fillRect(px + 5, py + 6, 22, 16);
  g.fillStyle = '#3f9a4b'; g.fillRect(px + 8, py + 2, 16, 14);
  g.fillStyle = '#58b862'; g.fillRect(px + 11, py + 5, 6, 4);
}

function pill(text, cx, cy, bg, fg) {
  g.font = 'bold 12px "Noto Sans TC", sans-serif';
  const w = g.measureText(text).width + 12;
  g.fillStyle = bg; g.fillRect(cx - w / 2, cy - 9, w, 18);
  g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.strokeRect(cx - w / 2, cy - 9, w, 18);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, cx, cy + 1);
}

function drawBuilding(b) {
  if (b.sc.status === 'build') return drawSite(b);
  const sc = b.sc, x = b.x * T, y = b.y * T, w = b.w * T, h = b.h * T;
  const roofY = y, roofH = 2 * T, wallY = y + 2 * T;
  // 陰影
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(x + 4, y + h - 2, w, 6);
  // 牆
  g.fillStyle = sc.wall; g.fillRect(x, wallY, w, T);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(x, wallY + T - 3, w, 3);
  // 屋頂
  g.fillStyle = sc.roof; g.fillRect(x, roofY, w, roofH);
  g.fillStyle = 'rgba(255,255,255,.18)'; for (let xx = x + 6; xx + 8 <= x + w - 4; xx += 16) g.fillRect(xx, roofY + 6, 8, roofH - 12);
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(x, roofY + roofH - 4, w, 4);
  // 窗（寬的建築，門兩邊各排一排窗）
  const dx = b.door.x * T, dy = b.door.y * T;
  for (let wx = x + 8; wx + 14 <= x + w - 8; wx += 30) {
    if (wx + 14 > dx && wx < dx + T) continue;
    g.fillStyle = '#9fd2ee'; g.fillRect(wx, wallY + 8, 14, 14);
    g.fillStyle = '#fff'; g.fillRect(wx + 2, wallY + 10, 4, 4);
  }
  // 門
  g.fillStyle = '#6b4226'; g.fillRect(dx + 4, dy + 2, 24, 30);
  g.fillStyle = '#8a5a34'; g.fillRect(dx + 7, dy + 5, 8, 12); g.fillRect(dx + 17, dy + 5, 8, 12);
  g.fillStyle = '#f2b632'; g.fillRect(dx + 22, dy + 18, 3, 3);
  if (b.soon) {   // 維修中：門用木板釘起來，房子蓋一層灰
    g.fillStyle = 'rgba(120,120,120,.28)'; g.fillRect(x, y, w, h);
    g.fillStyle = '#c99a5b'; g.fillRect(dx + 2, dy + 8, 28, 5); g.fillRect(dx + 2, dy + 19, 28, 5);
    g.fillStyle = '#8a6434'; g.fillRect(dx + 5, dy + 9, 2, 2); g.fillRect(dx + 25, dy + 9, 2, 2); g.fillRect(dx + 5, dy + 20, 2, 2); g.fillRect(dx + 25, dy + 20, 2, 2);
  }
  // 招牌：emoji + 名稱
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '28px "Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.fillStyle = '#000';
  g.fillText(sc.emoji, x + w / 2, roofY + 22);
  g.font = 'bold 14px "Noto Sans TC", sans-serif';
  const label = S.script === 'simp' ? (ZHS[sc.id] || sc.zh) : sc.zh, lw = g.measureText(label).width + 14;
  g.fillStyle = '#fffdf6'; g.fillRect(x + w / 2 - lw / 2, roofY + 40, lw, 17);
  g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.strokeRect(x + w / 2 - lw / 2, roofY + 40, lw, 17);
  g.fillStyle = '#1b1a22'; g.fillText(label, x + w / 2, roofY + 49);
  if (b.soon) { hazardSign(S.script === 'simp' ? '🚧 维修中' : '🚧 維修中', x + w / 2, roofY - 2); return; }   // 牌子掛在屋頂上緣，不擋到 emoji
  // 完成標記
  const r = S.done[sc.id];
  if (r) pill(starText(starsOf(r)), x + w / 2, roofY - 2, '#1b1a22', '#ffd66b');   // 掛在屋頂上緣，不擋到 emoji
}

/* 黃黑斜紋的告示牌 */
function hazardSign(text, cx, cy) {
  g.font = 'bold 12px "Noto Sans TC", sans-serif';
  const w = g.measureText(text).width + 16, h = 18, x = cx - w / 2, y = cy - h / 2;
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#f2c230'; g.fillRect(x, y, w, h);
  g.fillStyle = '#1b1a22'; for (let i = -h; i < w; i += 10) { g.beginPath(); g.moveTo(x + i, y + h); g.lineTo(x + i + 5, y + h); g.lineTo(x + i + 5 + h, y); g.lineTo(x + i + h, y); g.fill(); }
  g.fillStyle = '#fffdf6'; g.fillRect(x + 4, y + 2, w - 8, h - 4);
  g.restore();
  g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.strokeRect(x, y, w, h);
  g.fillStyle = '#1b1a22'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, cx, cy + 1);
}

/* 建造中的工地：泥土地、圍欄、吊車、三角錐；門口是一道柵欄 */
function drawSite(b) {
  const x = b.x * T, y = b.y * T, w = b.w * T, h = b.h * T, dx = b.door.x * T, dy = b.door.y * T;
  // 泥土地
  g.fillStyle = '#b98d5c'; g.fillRect(x, y, w, h);
  g.fillStyle = '#a77c4e'; for (let i = 0; i < 14; i++) g.fillRect(x + rnd(b.x, b.y, i) * (w - 6), y + rnd(b.y, b.x, i) * (h - 4), 5, 3);
  // 地基（灰色水泥）
  g.fillStyle = '#9a9a9a'; g.fillRect(x + 10, y + 26, w - 20, 26);
  g.fillStyle = '#b5b5b5'; g.fillRect(x + 10, y + 26, w - 20, 4);
  g.fillStyle = '#7d7d7d'; for (let xx = x + 16; xx < x + w - 14; xx += 14) g.fillRect(xx, y + 18, 3, 34);   // 鋼筋
  // 吊車
  g.fillStyle = '#f2b632'; g.fillRect(x + w - 22, y + 4, 6, 50);
  g.fillRect(x + 12, y + 4, w - 28, 5);
  g.fillStyle = '#1b1a22'; g.fillRect(x + 22, y + 9, 1, 14); g.fillRect(x + 18, y + 23, 9, 5);
  for (let yy = y + 10; yy < y + 54; yy += 8) { g.fillStyle = '#c98f1e'; g.fillRect(x + w - 22, yy, 6, 2); }
  // 圍欄（門口那格留給柵欄）
  g.fillStyle = '#f3efe2'; g.strokeStyle = '#1b1a22'; g.lineWidth = 1;
  const fence = (fx, fy, fw, fh) => { g.fillStyle = '#f3efe2'; g.fillRect(fx, fy, fw, fh); g.fillStyle = '#2f7d3a'; g.fillRect(fx, fy + fh - 3, fw, 3); };
  fence(x, y, w, 6);                       // 上
  fence(x, y, 6, h); fence(x + w - 6, y, 6, h);   // 左右
  fence(x, y + h - 10, dx - x, 10); fence(dx + T, y + h - 10, x + w - dx - T, 10);   // 下面（門口兩邊）
  // 門口的紅白柵欄
  g.fillStyle = '#fff'; g.fillRect(dx + 2, dy + 14, 28, 7);
  g.fillStyle = '#d8402c'; for (let i = 0; i < 4; i++) g.fillRect(dx + 2 + i * 8, dy + 14, 4, 7);
  g.fillStyle = '#1b1a22'; g.fillRect(dx + 4, dy + 21, 2, 9); g.fillRect(dx + 26, dy + 21, 2, 9);
  // 三角錐
  const cone = (cx, cy) => { g.fillStyle = '#f2711c'; g.beginPath(); g.moveTo(cx, cy - 10); g.lineTo(cx + 6, cy + 2); g.lineTo(cx - 6, cy + 2); g.fill(); g.fillStyle = '#fff'; g.fillRect(cx - 3, cy - 4, 6, 2); g.fillStyle = '#1b1a22'; g.fillRect(cx - 7, cy + 2, 14, 2); };
  cone(dx - 8, dy + 26); cone(dx + T + 8, dy + 26);
  hazardSign(S.script === 'simp' ? '🏗️ 建造中' : '🏗️ 建造中', x + w / 2, y + 66);
}

function drawPlayer(now) {
  let px = P.x * T, py = P.y * T, k = 0;
  if (P.moving) { k = Math.min(1, (now - P.moving.t0) / STEP_MS); px = (P.moving.from.x + (P.moving.to.x - P.moving.from.x) * k) * T; py = (P.moving.from.y + (P.moving.to.y - P.moving.from.y) * k) * T; }
  const leg = P.moving ? (Math.floor(k * 2) % 2) : 0, bob = P.moving ? Math.abs(Math.sin(k * Math.PI)) * 2 : 0;
  py -= bob;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(px + 8, py + 28 + bob, 16, 4);
  // 腿
  g.fillStyle = '#2d3a63'; g.fillRect(px + 10, py + 22, 5, 7 - (leg ? 2 : 0)); g.fillRect(px + 17, py + 22, 5, 7 - (leg ? 0 : 2));
  // 身體（紅色外套）
  g.fillStyle = '#d8402c'; g.fillRect(px + 8, py + 13, 16, 10);
  g.fillStyle = '#f2b632'; g.fillRect(px + 15, py + 13, 2, 10);
  // 手
  g.fillStyle = '#f1c9a0'; g.fillRect(px + 6, py + 15, 3, 6); g.fillRect(px + 23, py + 15, 3, 6);
  // 頭
  g.fillStyle = '#f1c9a0'; g.fillRect(px + 9, py + 3, 14, 11);
  g.fillStyle = '#2b2118'; g.fillRect(px + 8, py + 1, 16, 5); g.fillRect(px + 8, py + 4, 2, 6); g.fillRect(px + 22, py + 4, 2, 6);
  if (P.dir === 'up') { g.fillRect(px + 9, py + 4, 14, 8); }
  else {
    g.fillStyle = '#1b1a22';
    const ox = P.dir === 'left' ? -2 : P.dir === 'right' ? 2 : 0;
    g.fillRect(px + 12 + ox, py + 8, 2, 3); g.fillRect(px + 18 + ox, py + 8, 2, 3);
  }
}

/* 不會動的部分（地面、樹、建築）先畫在一張背景圖上，每一格只要貼上去 */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
function bakeStatic() {
  const keep = g; g = bg.getContext('2d'); g.imageSmoothingEnabled = false;
  drawGround(); trees.forEach(drawTree); buildings.forEach(drawBuilding);
  g = keep;
}
/* 鏡頭：畫面只看得到 VIEW_ROWS 列，跟著玩家上下捲動（不超出地圖上下邊） */
let camY = 0, camSnap = true;
function updateCamera(now, dt) {
  let py = P.y * T;
  if (P.moving) py = (P.moving.from.y + (P.moving.to.y - P.moving.from.y) * Math.min(1, (now - P.moving.t0) / STEP_MS)) * T;
  const target = Math.max(0, Math.min(H - VH, py + T / 2 - VH / 2));
  if (camSnap) { camY = target; camSnap = false; }
  else camY += (target - camY) * Math.min(1, dt * 8);
  if (Math.abs(target - camY) < 0.5) camY = target;
}
function draw(now) {
  const cy = Math.round(camY);
  g.save(); g.translate(0, -cy);
  g.drawImage(bg, 0, cy, W, VH, 0, cy, W, VH);
  // 目的地提示
  if (P.path.length) { const t = P.path[P.path.length - 1]; g.strokeStyle = '#f2b632'; g.lineWidth = 3; g.strokeRect(t.x * T + 3, t.y * T + 3, T - 6, T - 6); }
  drawLife(now);
  drawPlayer(now);
  g.restore();
}

/* ══════════════════════════════════════
   遊戲視窗：iframe 嵌入，結束後用 postMessage 回報成績
══════════════════════════════════════ */
const ov = document.getElementById('overlay'), frame = document.getElementById('frame');
let current = null;
function openGame(b) {
  if (current) return;
  current = b; b.result = null; P.locked = true; card.hidden = true;
  const q = new URLSearchParams({ embed: '1', name: S.name, code: S.code, s: S.script, l: S.lang });
  if (b.first) q.set('first', b.first);          // 路上突發事件：先玩看到的那件
  document.getElementById('ov-title').textContent = (b.sc.virtual ? '⚠️' : b.sc.emoji) + ' ' + b.sc.zh + ' · ' + X(b.sc.es, b.sc.en);
  frame.src = 'games/' + b.sc.id + '/index.html?' + q;
  ov.classList.add('on');
  Music.stop();                                   // 遊戲有自己的音樂
  try { gtag('event', 'map_enter', { scene: b.sc.id }); } catch (e) {}
}
function closeGame() {
  if (!current) return;
  const b = current; current = null;
  ov.classList.remove('on'); frame.blur(); frame.src = 'about:blank';
  cv.focus({ preventScroll: true }); window.focus();     // 鍵盤焦點交回地圖，方向鍵馬上能用
  if (Music.on) Music.start();
  P.x = b.out.x; P.y = b.out.y; P.dir = 'down'; P.moving = null; P.path = []; P.locked = false; camSnap = true;
  if (b.sc.virtual) respawnEvent(P.x, P.y);
  updateHud();
}
/* 記下這一關的成績，關掉遊戲視窗 */
function completeScene(d) {
  S.done[d.scene] = bestOf(S.done[d.scene], d);
  save(); pushProgress();
  const sc = SCENES.find(s => s.id === d.scene);
  closeGame();
  toast('✓ ' + (sc ? sc.zh : d.scene) + '：' + d.score + ' ' + X('puntos', 'points') + (d.mistakes ? ' · ' + d.mistakes + ' ' + X('errores', 'mistakes') : ' · ' + X('¡sin errores!', 'no mistakes!')) + '  ' + starText(starsOf(d)));
  try { gtag('event', 'map_complete', { scene: d.scene, score: d.score }); } catch (e) {}
}
/* 遊戲送來的訊息：
   scene-result   玩完、排行榜出現了（先記著；這時按右上角「✕ Salir」也算完成）
   scene-complete 按了「回到地圖」 */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !current || e.source !== frame.contentWindow) return;
  if (d.type === 'scene-result') current.result = d;
  if (d.type === 'scene-complete') completeScene(d);
});
document.getElementById('ov-close').onclick = () => { if (current && current.result) completeScene(current.result); else closeGame(); };

/* ══════════════════════════════════════
   介面
══════════════════════════════════════ */
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3600);
}
/* 維修中／建造中：進不去，顯示「還在準備中，敬請期待」（中文＋玩家選的語言） */
function comingSoon(b) {
  const simp = S.script === 'simp', sc = b.sc;
  const name = simp ? (ZHS[sc.id] || sc.zh) : sc.zh;
  toast((sc.status === 'build' ? '🏗️ ' : '🚧 ') + name + '：' + (simp ? '还在准备中，敬请期待' : '還在準備中，敬請期待') + '\n' +
    X('Todavía lo estamos preparando. ¡Muy pronto!', "We're still getting it ready. Coming soon!"));
  try { gtag('event', 'map_coming_soon', { place: sc.id }); } catch (e) {}
}
function updateHud() {
  bakeStatic();
  const simp = S.script === 'simp';
  const LV = liveScenes();
  const stars = LV.reduce((t, s) => t + starsOf(S.done[s.id]), 0), maxStars = LV.length * 3;
  const total = LV.reduce((t, s) => t + (S.done[s.id] ? Math.max(0, S.done[s.id].score) : 0), 0);
  document.getElementById('hud-title').textContent = simp ? '台湾生存日记' : '台灣生存日記';
  document.getElementById('intro-title').textContent = simp ? '台湾生存日记' : '台灣生存日記';
  document.getElementById('who').textContent = '👤 ' + S.name + (S.code ? ' · ' + S.code : '') + ' ✎';
  const cl = document.getElementById('code-line');
  cl.hidden = !S.code;
  if (S.code) cl.innerHTML = `你的代碼 · ${X('Tu código', 'Your code')}：<b>${S.code}</b><br><small>${(S.script === 'simp' ? '记下来，换装置时用。 ' : '記下來，換裝置時用。 ') + X('Anótalo para usarlo en otro dispositivo.', 'Write it down to use on another device.')}</small>`;
  document.getElementById('wk-label').textContent = '收集星星' + ' · ' + X('Estrellas', 'Stars');
  document.getElementById('wk-num').textContent = '⭐ ' + stars + ' / ' + maxStars + ' · ' + (simp ? '总分' : '總分') + ' ' + total;
  document.getElementById('wk-fill').style.width = (stars / maxStars * 100) + '%';
  document.getElementById('btn-reset').textContent = X('↻ Borrar progreso', '↻ Reset progress');
  document.getElementById('ov-close').textContent = '✕ ' + X('Salir', 'Exit');
  const touch = matchMedia('(pointer: coarse)').matches;
  document.getElementById('help').textContent = touch ? X('Toca un edificio para ir a su puerta · toca a una persona para ver pinyin y traducción · si ves un ❗, acércate', 'Tap a building to go to its door · tap a person for pinyin and translation · if you see a ❗, walk next to it') : X('Flechas / WASD para caminar · toca un edificio para ir a su puerta · toca a una persona para ver pinyin y traducción · si ves un ❗, acércate para ayudar', 'Arrow keys / WASD to walk · tap a building to go to its door · tap a speech bubble for pinyin and translation · if you see a ❗, walk next to it to help');
  fitView();
}
/* 只有中文時，拿掉因為少了翻譯而留在行尾的「 · 」；改回有翻譯時再還原 */
const _zhOrig = new WeakMap();
function cleanZh() {
  const walk = n => {
    if (n.nodeType === 3) {
      if (!/[·｜|]\s*$/.test(_zhOrig.get(n) ?? n.nodeValue)) return;
      if (!_zhOrig.has(n)) _zhOrig.set(n, n.nodeValue);
      const o = _zhOrig.get(n);
      const v = S.lang === 'zh' ? o.replace(/\s*[·｜|]\s*$/, '') : o;
      if (v !== n.nodeValue) n.nodeValue = v;
    } else if (n.nodeType === 1 && !/^(SCRIPT|STYLE)$/.test(n.tagName)) n.childNodes.forEach(walk);
  };
  walk(document.body);
}
function applyLang() {
  document.querySelectorAll('[data-es]').forEach(el => { el.textContent = X(el.dataset.es, el.dataset.en); });
  document.documentElement.dataset.ui = S.lang;
  const nameLab = document.querySelector('label[for="name"]');
  if (nameLab && nameLab.firstChild && nameLab.firstChild.nodeType === 3) {
    if (!nameLab.dataset.o) nameLab.dataset.o = nameLab.firstChild.nodeValue;
    nameLab.firstChild.nodeValue = S.lang === 'zh' ? nameLab.dataset.o.replace(/\s*\/\s*$/, '') : nameLab.dataset.o;
  }
  bub.dataset.k = '';
  const so = document.getElementById('set-open');
  if (so && typeof SetUI !== 'undefined') so.textContent = '⚙️ ' + SetUI.zh('設定') + (S.lang === 'zh' ? '' : ' · ' + X('Ajustes', 'Settings'));
  updateHud();
  cleanZh();
}
/* ⚙️ 設定：字體、語言、拼音／注音、語速（和所有遊戲同一組） */
const SetUI = {
  T: {
    title: ['設定', 'Ajustes', 'Settings'], script: ['字體', 'Caracteres', 'Characters'], lang: ['語言', 'Idioma', 'Language'],
    phon: ['拼音／注音', 'Pinyin / Zhuyin', 'Pinyin / Zhuyin'], rate: ['語速', 'Velocidad de voz', 'Voice speed'],
    pinyin: ['拼音', 'Pinyin', 'Pinyin'], zhuyin: ['注音', 'Zhuyin', 'Zhuyin'], both: ['兩者', 'Ambos', 'Both'], off: ['關閉', 'Ninguno', 'Off'],
    slow: ['慢', 'Lento', 'Slow'], normal: ['正常', 'Normal', 'Normal'], fast: ['快', 'Rápido', 'Fast'], done: ['完成', 'Listo', 'Done']
  },
  zh(t) { return S.script === 'simp' ? (ZHT[t] || t) : t; },
  tx(k) { const v = this.T[k], sub = S.lang === 'zh' ? '' : (S.lang === 'en' ? v[2] : v[1]); return this.zh(v[0]) + (sub ? '<small>' + sub + '</small>' : ''); },
  opt(label, on, k, v) { return '<button type="button" class="set-opt' + (on ? ' on' : '') + '" data-k="' + k + '" data-v="' + v + '">' + label + '</button>'; },
  draw() {
    const o = document.getElementById('set-ov');
    o.innerHTML = '<div class="set-card" role="dialog"><h2>⚙️ ' + this.zh('設定') + (S.lang === 'zh' ? '' : ' · ' + X('Ajustes', 'Settings')) + '</h2>' +
      '<div class="set-group"><h3>' + this.tx('script') + '</h3><div class="set-opts">' + this.opt('繁體', S.script === 'trad', 'script', 'trad') + this.opt('简体', S.script === 'simp', 'script', 'simp') + '</div></div>' +
      '<div class="set-group"><h3>' + this.tx('lang') + '</h3><div class="set-opts">' + this.opt('中文＋<small>Español</small>', S.lang === 'es', 'lang', 'es') + this.opt('中文＋<small>English</small>', S.lang === 'en', 'lang', 'en') + this.opt(this.zh('只有中文'), S.lang === 'zh', 'lang', 'zh') + '</div></div>' +
      '<div class="set-group"><h3>' + this.tx('phon') + '</h3><div class="set-opts two">' + ['pinyin', 'zhuyin', 'both', 'off'].map(v => this.opt(this.tx(v), S.phon === v, 'phon', v)).join('') + '</div></div>' +
      '<div class="set-group"><h3>' + this.tx('rate') + '</h3><div class="set-opts">' + ['slow', 'normal', 'fast'].map(v => this.opt(this.tx(v), S.rate === v, 'rate', v)).join('') + '</div></div>' +
      '<button type="button" class="set-done" id="set-done">' + this.zh('完成') + (S.lang === 'zh' ? '' : ' · ' + X('Listo', 'Done')) + '</button></div>';
    o.querySelectorAll('.set-opt').forEach(b => b.onclick = () => this.set(b.dataset.k, b.dataset.v));
    document.getElementById('set-done').onclick = () => this.close();
  },
  open() { this.draw(); document.getElementById('set-ov').classList.add('show'); },
  close() { document.getElementById('set-ov').classList.remove('show'); },
  set(k, v) {
    if (!SET_OPTS[k] || !SET_OPTS[k].includes(v)) return;
    S[k] = v; save(); applyLang(); this.draw();
    if (!card.hidden && bubNow) openCard(bubNow);
    if (k === 'rate') say('你好，歡迎光臨');
  }
};
document.getElementById('set-open').onclick = () => SetUI.open();
document.getElementById('set-ov').addEventListener('click', e => { if (e.target.id === 'set-ov') SetUI.close(); });
window.addEventListener('storage', e => { if (e.key === SETTINGS_KEY && readShared()) { applyLang(); if (document.getElementById('set-ov').classList.contains('show')) SetUI.draw(); } });
document.getElementById('name').value = S.name || '';
function begin() {
  const v = document.getElementById('name').value.trim();
  if (!v) { document.getElementById('name-err').textContent = '請輸入名字 ' + X('Escribe tu nombre', 'Enter your name'); return; }
  const code = TWPlayer.codeFor(v);
  if (code !== S.code) { if (S.code) S.done = {}; S.code = code; }   // 換成另一個玩家：進度用他自己的
  S.name = v; save();
  document.getElementById('intro').style.display = 'none';
  updateHud(); pullProgress();
}
/* 換裝置：輸入代碼 → 讀回名字和地圖進度 */
document.getElementById('code-go').onclick = async () => {
  const err = document.getElementById('code-err'), c = TWPlayer.normCode(document.getElementById('code-in').value);
  const say = (zh, es, en) => { err.textContent = (zh ? zh + ' ' : '') + X(es, en); };
  if (!c) return say('代碼是 3 個英文字母＋4 個數字，例如 MAR-4821。', 'El código tiene 3 letras y 4 números, por ejemplo MAR-4821.', 'The code has 3 letters and 4 numbers, e.g. MAR-4821.');
  if (!window._FB) return say('連不上網路，請稍後再試。', 'Sin conexión. Inténtalo más tarde.', 'No connection. Please try again later.');
  say('讀取中……', 'Cargando…', 'Loading…');
  let d = null;
  try { d = await window._FB.getProgress(c); } catch (e) { return say('連不上網路，請稍後再試。', 'Sin conexión. Inténtalo más tarde.', 'No connection. Please try again later.'); }
  if (!d || !d.name) return say('找不到這個代碼。', 'No encontramos ese código.', "We couldn't find that code.");
  if (c !== S.code) S.done = {};
  S.code = c; S.name = d.name; S.done = mergeDone(S.done, d.done);
  TWPlayer.remember(d.name, c); save();
  err.textContent = '';
  document.getElementById('name').value = d.name;
  document.getElementById('have-code').open = false;
  begin();
  toast('👋 ' + d.name + '　' + X('¡Bienvenido/a de nuevo!', 'Welcome back!'));
};
document.getElementById('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('code-go').click(); });
document.getElementById('start').onclick = begin;
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });
document.getElementById('btn-reset').onclick = () => {
  if (confirm('清除所有進度？ ' + X('¿Borrar todo el progreso?', 'Clear all progress?'))) { S.done = {}; save(); pushProgress(); updateHud(); }
};

/* 鍵盤、方向鍵、點地圖 */
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
addEventListener('keydown', e => {
  if (current || document.getElementById('intro').style.display !== 'none' || e.target.tagName === 'INPUT') return;
  const d = KEYMAP[e.key]; if (d) { P.held = d; P.path = []; e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'Enter') && bubNow) { e.preventDefault(); openCard(bubNow); }
  if (e.key === 'Escape') card.hidden = true;
});
addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d && P.held === d) P.held = null; });
cv.addEventListener('pointerdown', e => {
  if (current) return;
  const r = cv.getBoundingClientRect();
  goTo(Math.floor((e.clientX - r.left) / r.width * COLS), Math.floor(((e.clientY - r.top) / r.height * VH + camY) / T));
});

/* 地圖鋪滿整個螢幕：依螢幕高度算能看到幾列（建築大小不變，只是看到更多街道） */
function fitView() {
  const scale = (cv.clientWidth - 8) / W; if (!(scale > 0)) return;
  const top = cv.getBoundingClientRect().top + scrollY, helpH = document.getElementById('help').offsetHeight;
  const avail = innerHeight - top - helpH - 20;
  const rows = Math.max(10, Math.min(ROWS, Math.floor(avail / (T * scale))));
  if (rows === VIEW_ROWS && cv.height === rows * T) return;
  VIEW_ROWS = rows; VH = rows * T; cv.height = VH; g.imageSmoothingEnabled = false; camSnap = true;
}
addEventListener('resize', () => { fitView(); });
addEventListener('orientationchange', () => setTimeout(fitView, 200));
respawnEvent(P.x, P.y);
applyLang();
try { document.fonts.ready.then(() => { bakeStatic(); fitView(); }); } catch (e) {}
fitView();
// 已經有名字（在清單頁或上次輸入過）：直接進地圖；點 👤 可以改
if (S.name) {
  document.getElementById('intro').style.display = 'none';
  if (!S.code) { S.code = TWPlayer.codeFor(S.name); save(); }    // 以前就玩過的人：補一個代碼
  updateHud(); pullProgress();
}
document.getElementById('who').onclick = () => { document.getElementById('name').value = S.name; document.getElementById('intro').style.display = 'flex'; };
/* 地圖開關：讀 Firebase 的 settings/map，打開的新遊戲才能進去（讀不到就維持維修中） */
TWFB.when(async fb => {
  const o = await fb.getMapSettings();
  Object.keys(o).forEach(k => { OPEN[k] = o[k] === true; });
  buildings.forEach(b => { b.soon = !!b.sc.status || !isLive(b.sc); });
  updateHud();
});
window.WorldMap = { EV, VEHICLES, WALKERS, AMI, respawnEvent, P, S, SCENES, buildings, goTo, openGame, closeGame };
requestAnimationFrame(tick);
Music.init({ bpm: 112, tracks: [
  { wave: 'square', vol: 0.32, notes: 'E5 - G5 - A5 G5 E5 - | D5 - E5 - G5 - - . | E5 - G5 - A5 C6 A5 G5 | E5 - D5 - C5 - - .' },
  { wave: 'triangle', vol: 0.7, notes: 'C3 . G3 . C3 . G3 . | A2 . E3 . A2 . E3 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . B2 .' },
  { vol: 0.45, notes: 'k . h . s . h . k k h . s . h .' }] });
</script>
